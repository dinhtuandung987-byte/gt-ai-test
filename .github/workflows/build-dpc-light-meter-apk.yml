name: Build DPC Light Meter V1.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DPC_Light_Meter_V1_1_Android_Source.zip'
      - '.github/workflows/build-dpc-light-meter-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V1.1 source
        run: |
          rm -rf light-meter-build
          mkdir -p light-meter-build
          unzip -q DPC_Light_Meter_V1_1_Android_Source.zip -d light-meter-build
          test -d light-meter-build/LightMeter

      - name: Build APK
        run: |
          cd light-meter-build/LightMeter
          gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          APK=$(find light-meter-build/LightMeter/app/build/outputs/apk -name 'app-debug.apk' -print -quit)
          test -n "$APK"
          cp "$APK" apk-output/DPC_Light_Meter_V1_1.apk
          ls -lh apk-output/DPC_Light_Meter_V1_1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DPC_Light_Meter_V1_
