name: Build DPC Daily Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dpc-daily-android/**'
      - '.github/workflows/build-dpc-daily-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        shell: bash
        run: |
          rm -rf android-build
          mkdir -p android-build

          ZIP=$(find dpc-daily-android -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Khong tim thay file ZIP Android"
            exit 1
          fi

          echo "Using ZIP: $ZIP"
          unzip -q "$ZIP" -d android-build

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find android-build -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Khong tim thay Android Gradle project"
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

      - name: Fix Android source
        shell: bash
        run: |
          ROOT="${{ steps.project.outputs.root }}"
          XML="$ROOT/app/src/main/res/layout/activity_main.xml"
          APP_GRADLE="$ROOT/app/build.gradle.kts"

          python3 - "$XML" "$APP_GRADLE" <<'PY'
          import sys
          from pathlib import Path

          xml = Path(sys.argv[1])
          gradle = Path(sys.argv[2])

          text = xml.read_text(encoding="utf-8")
          text = text.replace(
              "LƯU CÔNG VIỆC & ĐẶT CẢNH BÁO",
              "LƯU CÔNG VIỆC &amp; ĐẶT CẢNH BÁO"
          )
          xml.write_text(text, encoding="utf-8")

          g = gradle.read_text(encoding="utf-8")

          fix = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }'''

          if "sourceCompatibility = JavaVersion.VERSION_17" not in g:
              g = g.replace("android {", fix, 1)

          gradle.write_text(g, encoding="utf-8")
          PY

          echo "===== app/build.gradle.kts ====="
          cat "$APP_GRADLE"

      - name: Build debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.root }}"
          gradle assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.root }}" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "Khong tim thay APK sau khi build"
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/DPC_Daily_Assistant_V3.apk

          echo "===== APK CREATED ====="
          ls -lh apk-output/DPC_Daily_Assistant_V3.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DPC_Daily_Assistant_V3_APK
          path: apk-output/DPC_Daily_Assistant_V3.apk
          if-no-files-found: error
          retention-days: 30
