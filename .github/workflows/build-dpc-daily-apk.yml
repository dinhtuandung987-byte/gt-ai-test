name: Build DPC Daily Assistant V5.3 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and extract V5.3 source
        shell: bash
        run: |
          set -e

          echo "=== Files in repository ==="
          find . -maxdepth 2 -type f | sort

          SOURCE=$(find . -type f \
            \( -iname "*V5_3*.zip" -o -iname "*V5.3*.zip" \) \
            | head -n 1)

          if [ -z "$SOURCE" ]; then
            echo "ERROR: Không tìm thấy ZIP source V5.3"
            exit 1
          fi

          echo "Found source: $SOURCE"

          rm -rf android-build
          mkdir -p android-build

          unzip -q "$SOURCE" -d android-build

          echo "=== Extracted ==="
          find android-build -maxdepth 3 -type f | sort | head -100

      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android-build -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Không tìm thấy settings.gradle/settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Building V5.3..."
          gradle --no-daemon assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build xong nhưng không tìm thấy APK"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK found: $APK"

          mkdir -p apk-output
          cp "$APK" apk-output/DPC_Daily_Assistant_V5_3.apk

      - name: Upload V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: DPC-Daily-Assistant-V5.3-APK
          path: apk-output/DPC_Daily_Assistant_V5_3.apk
          if-no-files-found: error
