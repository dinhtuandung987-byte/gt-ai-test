name: Build DPC Daily Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dpc-daily-android/**'
      - '.github/workflows/build-dpc-daily-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q dpc-daily-android/DPC_Daily_Assistant_V4_0_Android_Source.zip -d android-build
          ls -la android-build

      - name: Fix Android source
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android-build")
          xml = root / "app/src/main/res/layout/activity_main.xml"

          if not xml.exists():
              raise SystemExit("activity_main.xml not found")

          s = xml.read_text(encoding="utf-8")

          # Fix unescaped ampersands
          s = re.sub(r'&(?!amp;|lt;|gt;|quot;|apos;|#)', '&amp;', s)

          # Add required layout dimensions to TextView tags if missing
          def fix_textview(match):
              tag = match.group(0)
              if "android:layout_width=" not in tag:
                  tag = tag.replace(
                      "<TextView",
                      '<TextView android:layout_width="wrap_content"',
                      1
                  )
              if "android:layout_height=" not in tag:
                  tag = tag.replace(
                      "<TextView",
                      '<TextView android:layout_height="wrap_content"',
                      1
                  )
              return tag

          s = re.sub(r'<TextView\b[^>]*?/>', fix_textview, s, flags=re.S)

          xml.write_text(s, encoding="utf-8")

          gradle = root / "app/build.gradle.kts"
          g = gradle.read_text(encoding="utf-8")

          if "compileOptions" not in g:
              pos = g.rfind("}")
              block = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
              '''
              g = g[:pos] + block + g[pos:]
              gradle.write_text(g, encoding="utf-8")

          print("Android source fixed")
          PY

      - name: Build debug APK
        run: |
          cd android-build
          gradle assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp android-build/app/build/outputs/apk/debug/app-debug.apk \
             apk-output/DPC_Daily_Assistant_V3.apk
          ls -lh apk-output/DPC_Daily_Assistant_V4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DPC_Daily_Assistant_V4_APK
          path: apk-output/DPC_Daily_Assistant_V3.apk
          retention-days: 30
