name: Build DPC Daily Assistant V4.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'dpc-daily-android/DPC_Daily_Assistant_V4_1_Android_Source.zip'
      - '.github/workflows/build-dpc-daily-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V4.1 source
        run: |
          set -e
          rm -rf android-build
          mkdir -p android-build

          SOURCE="dpc-daily-android/DPC_Daily_Assistant_V4_1_Android_Source.zip"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: V4.1 source ZIP not found"
            exit 1
          fi

          unzip -q "$SOURCE" -d android-build
          echo "V4.1 source extracted successfully"

      - name: Validate and fix XML
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android-build/app/src/main/res")

          if not root.exists():
              raise SystemExit("Android resource folder not found")

          for xml in root.rglob("*.xml"):
              text = xml.read_text(encoding="utf-8")

              fixed = re.sub(
                  r'&(?!amp;|lt;|gt;|quot;|apos;|#\d+;|#x[0-9A-Fa-f]+;)',
                  '&amp;',
                  text
              )

              if fixed != text:
                  xml.write_text(fixed, encoding="utf-8")
                  print("Fixed:", xml)

          print("XML validation completed")
          PY

      - name: Verify V4.1 project
        run: |
          set -e

          test -f android-build/settings.gradle.kts
          test -f android-build/app/build.gradle.kts
          test -f android-build/app/src/main/AndroidManifest.xml

          echo "===== VERSION ====="
          grep -n "applicationId" android-build/app/build.gradle.kts || true
          grep -n "versionCode" android-build/app/build.gradle.kts || true
          grep -n "versionName" android-build/app/build.gradle.kts || true

      - name: Build V4.1 APK
        run: |
          set -e
          cd android-build
          gradle assembleDebug --stacktrace --no-daemon

      - name: Collect V4.1 APK
        run: |
          set -e
          mkdir -p apk-output

          APK=$(find android-build/app/build/outputs/apk \
            -type f \
            -name "app-debug.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find android-build -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK" \
            apk-output/DPC_Daily_Assistant_V4_1.apk

          echo "APK READY:"
          ls -lh apk-output/DPC_Daily_Assistant_V4_1.apk

      - name: Generate SHA256
        run: |
          cd apk-output
          sha256sum DPC_Daily_Assistant_V4_1.apk \
            > DPC_Daily_Assistant_V4_1_SHA256.txt

          cat DPC_Daily_Assistant_V4_1_SHA256.txt

      - name: Upload V4.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: DPC_Daily_Assistant_V4_1_APK
          path: |
            apk-output/DPC_Daily_Assistant_V4_1.apk
            apk-output/DPC_Daily_Assistant_V4_1_SHA256.txt
          if-no-files-found: error
          retention-days: 30
